name: Flowery.WinUI CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '28 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-24.04
          - language: csharp
            build-mode: manual
            os: windows-2025-vs2026
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-24.04
          - language: python
            build-mode: none
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        env:
          # Overlay databases do not support the manual C# build.
          CODEQL_OVERLAY_DATABASE_MODE: ${{ matrix.language == 'csharp' && 'none' || '' }}
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true
      - name: Build native Windows solution
        if: matrix.language == 'csharp'
        shell: pwsh
        run: ./scripts/build_all.ps1 -Configuration Release -NoRun
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
