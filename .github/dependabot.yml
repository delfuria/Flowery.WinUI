version: 2
updates:
  - package-ecosystem: "nuget"
    # The root solution covers ten projects; these three projects are outside it.
    directories:
      - "/"
      - "/Flowery.WinUI.UnitTests"
      - "/Tools/IconGenerator"
      - "/Tools/PatternGenerator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      mstest:
        patterns:
          - "MSTest"
          - "MSTest.*"
          - "Microsoft.Testing.*"
      mstest-security:
        applies-to: security-updates
        patterns:
          - "MSTest"
          - "MSTest.*"
          - "Microsoft.Testing.*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      shared-packages:
        # One PR per package across directories sharing Directory.Packages.props.
        group-by: dependency-name
        patterns:
          - "*"
        exclude-patterns:
          - "MSTest"
          - "MSTest.*"
          - "Microsoft.Testing.*"
          - "SkiaSharp*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      # Most actions are pinned to a major tag, so updates are mostly major releases.
      github-actions:
        patterns:
          - "*"
